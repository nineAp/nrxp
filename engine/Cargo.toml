[package]
name = "netrunner-tls-engine"
version = "0.1.0"
edition = "2021"
description = "Public mirror of Netrunner's TLS-mimicry engine (fingerprint calibrations redacted)"
license = "AGPL-3.0-only"

[dependencies]
netrunner-logger = { path = "../logger" }
chacha20poly1305 = "0.10.1"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
aead = { version = "0.5.2", features = ["bytes"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }
bytes = "1.5"
hex = "0.4.3"
rand = "0.10.0"
